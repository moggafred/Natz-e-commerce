<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-theme.css" id="dark-theme-style" disabled>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html" style="text-decoration: none; color: #f68b1e;">Natz Market</a></div>
            <div class="nav-links">
                <a href="login.html">Login</a>
                <a href="cart.html">Cart</a>
                <a href="account.html">Account</a>
                <a href="support.html">Support</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="settings-container">
            <h2>Settings</h2>
            <div class="personal-settings">
                <h3>Personal Information</h3>
                <form>
                    <input type="text" placeholder="Full Name" value="John Doe">
                    <input type="email" placeholder="Email" value="john.doe@example.com">
                    <input type="tel" placeholder="Phone Number" value="+1234567890">
                    <input type="date" placeholder="Date of Birth" value="1990-01-01">
                    <button type="submit">Save Changes</button>
                </form>
            </div>
            <div class="theme-settings">
                <h3>Theme</h3>
                <select id="theme-switcher">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Natz Market. All rights reserved. | <a href="how-to-use.html">How to Use</a></p>
    </footer>

    <script src="js/settings.js"></script>
</body>
</html>
