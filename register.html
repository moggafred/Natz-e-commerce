<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html" style="text-decoration: none; color: #f68b1e;">Natz Market</a></div>
            <div class="nav-links">
                <a href="cart.html">Cart</a>
                <a href="account.html">Account</a>
                <a href="support.html">Support</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-register-container">
            <div class="register-form">
                <h2>Register</h2>
                <form>
                    <input type="text" placeholder="Full Name" required>
                    <input type="tel" placeholder="Phone Number" required>
                    <input type="date" placeholder="Date of Birth" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <div class="terms">
                        <input type="checkbox" id="terms" required class="space-right"><label for="terms">I agree to the <a href="terms.html">Terms and Conditions</a></label>
                    </div>
                    <button type="submit">Register</button>
                </form>
                <p class="text-center">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Natz Market. All rights reserved. | <a href="how-to-use.html">How to Use</a></p>
    </footer>
    <script src="js/settings.js"></script>
</body>
</html>
